# ==============================================================================
# QuranSub Configuration
# ==============================================================================

subtitle:
  # Font that supports Bangla. "Nirmala UI" ships with Windows 10/11.
  # On Linux, install "Noto Sans Bengali" and use that name instead.
  font_name: "Nirmala UI"
  font_size: 22

  # ASS colors in &HAABBGGRR format
  primary_color: "&H00FFFFFF"      # White text
  outline_color: "&H00000000"      # Black outline
  back_color: "&H80000000"         # Semi-transparent black background

  outline_width: 2
  shadow_depth: 1
  bold: true

  # ASS alignment: 1=bottom-left  2=bottom-center  3=bottom-right
  #                4=mid-left     5=mid-center     6=mid-right
  #                7=top-left     8=top-center     9=top-right
  alignment: 2

  margin_left: 40
  margin_right: 40
  margin_vertical: 50

transcription:
  model_id: "tarteel-ai/whisper-base-ar-quran"
  base_model_id: "openai/whisper-base"        # for generation config
  chunk_length_s: 30
  stride_length_s: 5
  language: "ar"

matching:
  # Optional: set to a surah number (e.g. 6) to narrow the search space.
  # Leave as null to search the entire Quran automatically.
  surah_hint: null

video:
  codec: "libx264"
  crf: 18
  preset: "medium"
  # Optional directory of additional .ttf/.otf fonts for libass.
  fonts_dir: null

# Independent data, layout, typography, palette and animation controls.
# Coordinates/sizes scale from the shorter video dimension / reference_size.
word_by_word:
  enabled: true                 # false restores the old ayah subtitle pipeline
  data:
    cache_dir: "data/word_cache" # pinned Quran WBW download; reusable offline
    file: null                  # optional normalized Arabic/Bangla JSON override
  alignment:
    context_corrections: true   # repair small ASR errors between exact anchors
    max_edit_distance: 1        # maximum letter edits for a contextual correction
    min_similarity: 0.6
    beam_width: 32
    max_timestamp_overlap_s: 0.08  # reconcile tiny ASR overlaps; 0 disables repair
  recovery:
    enabled: true              # disable per run with --no-recovery
    min_word_duration_s: 5.0    # lower = retry more spans; higher = fewer retries
    context_s: 0.4             # audio padding around the suspicious word
    retry_context_s: 1.0       # padding for the second attempt
    max_window_s: 12.0         # hard cap on each audio retry
    max_regions: 6             # maximum suspicious regions retried per run
    max_attempts: 2             # 1 or 2
    min_exact_words: 3         # require this many exact matches before accepting
    min_coverage: 0.7          # fraction of original span covered by retry cues
    max_lookback_words: 16     # canonical context for finding a repeated phrase
  layout:
    reference_size: 720
    height: 202
    margin_x: 22
    margin_bottom: 24
    radius: 24
    padding: 16
    min_card_width: 180
    max_card_width: 300
    card_gap: 18
    center_x: 0.5               # fraction of frame width
    arabic_top: 14
    bangla_top: 102
  typography:
    arabic:
      font: "Noto Naskh Arabic"
      size: 48
    bangla:
      font: "Noto Sans Bengali"
      size: 24
      max_lines: 2
  palette:                      # regular #RRGGBB colors
    background: "#F4ECE7"
    decoration: "#DEDCEC"
    decoration_alt: "#D9E8DE"
    focus: "#FFF9F3"
    arabic: "#263D35"
    bangla: "#344A42"
    muted: "#8A918A"
    accent: "#719B89"
    opacity: 0.95
  motion:
    duration_ms: 180
    easing: "smoothstep"        # or linear
    fps: 30                     # animation subdivisions, not output frame rate
    pause_threshold: 1.2        # hide during longer silences
    hold_after_word: 0.35

paths:
  quran_csv: "data/ben_quran_with_tafsir.csv"
  output_dir: "output"
